name: Build N64 ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dragonminded/libdragon:latest

    env:
      N64_INST: /n64_toolchain
      LIBDRAGON_COMMIT: f667dd2bf8daa5734eef309367013623ee38fad5

    steps:
      - uses: actions/checkout@v6

      - name: Cache libdragon build
        id: cache-libdragon
        uses: actions/cache@v5
        with:
          path: /n64_toolchain
          key: libdragon-${{ env.LIBDRAGON_COMMIT }}

      - name: Build libdragon (preview)
        if: steps.cache-libdragon.outputs.cache-hit != 'true'
        run: |
          git init /tmp/libdragon
          cd /tmp/libdragon
          git remote add origin https://github.com/DragonMinded/libdragon.git
          git fetch --depth=1 origin $LIBDRAGON_COMMIT
          git checkout FETCH_HEAD
          ./build.sh $N64_INST

      - name: Build ROM
        run: make all

      - name: Upload ROM
        uses: actions/upload-artifact@v7
        with:
          name: mulmul_characterize
          path: mulmul_characterize.z64
